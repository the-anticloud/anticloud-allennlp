name: ci

# TRL-8 qualification: every commit re-runs the tests and the benchmarks, and
# a red sub-check blocks the merge. Nothing here is advisory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + coverage (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the checkout is clean and signed-off-able
        run: |
          git status --porcelain | tee /tmp/dirty
          test ! -s /tmp/dirty || (echo "working tree dirty" && exit 1)
          git fsck --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from the hash-pinned lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e .

      - name: Unit and property tests
        run: python -m pytest -q --cov=anticloud_ref --cov-report=term-missing --cov-report=json

      - name: Enforce the coverage floor (fail below, never silently pass)
        run: python -c "import json,sys;d=json.load(open('coverage.json'));t=d['totals']['percent'];print(f'coverage {t:.1f}%');sys.exit(0 if t>=85 else 1)"

      - name: Secret scan
        run: anticloud-ref secrets-scan . --exclude-fixtures

      - name: Licence scan (fails closed on any class B or C in src/)
        run: anticloud-ref licence-scan src

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e .

      - name: Run all 16 benchmarks
        run: python tools/run_bench.py

      - name: Publish the report and the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: bench-and-sbom
          path: |
            BENCH.json
            sbom.cdx.json

  perf:
    name: performance ceilings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e .
      - name: Cold-import, cold-start, memory ceiling, hot paths
        run: anticloud-ref perf --out perf-report.json
